당신께서는 무엇을 찾고 계시나요.
당신의 피에 젖은 십자가에
침을 뱉는 그들에게 무엇을 느끼시나요

당신에게 돌을 던지고
채찍질을 할때는
당신이라는 분은
어째서 말없이 십자가에 오르셨나요

하늘과 땅을 뒤집을 수 있으신
당신께서는 무엇을 위해
그 고통 당하셨나요.

서로 싸우고, 멸시하는 이 세상을
아직도 십자가에서 바라보시나요 ?

이땅의 제 잘난것들을 보시고
무엇을 생각하시나요.
아직도 멀었나요 ?
이세상은 도대체
얼마나 큰 희생을 요구하나요.

				96. 3. 12
