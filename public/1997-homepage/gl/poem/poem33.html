조그만 아침창을 열어
반가운 손님을 맞는다.
바람은 간밤의 쾌쾌함을 쓸어가고
햇살은 간밤의 어두움을 쓸어간다.
시원한 우유한잔과 맞이하는 아침은
향긋한 차와 함께 맞이하는 저녁
만큼이나 좋다.

희망이 삶과 어우러져 뛰노는 시간
그렇게 아침창을 연다.

			96.1.19
