이 분노의 정체는 무엇인가.
억압에 대한 자유의 탄원일까
나에대한 자학일까.

내 가슴속에는 아무것도 들어오지 않는구나.
슬픔, 분노, 알수없는 무기력.
그리고 아아 끝없는 욕망과 꿈의 희구.

끝없는 절망의 나락이 보이는가.
계속되는 시침소리 나를 떠미는구나.
도대체 무얼 하라는 것이고,
나에게 무얼 바라는 것인가.

나는 이제 무엇을 사랑하는 것인가
분노로만 가득차버린 내 마음이여.

 96.7.28
