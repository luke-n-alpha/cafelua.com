	크리스마스 정경
			95.12.12

흥겨운 캐롤과
손에 가득한 선물들
사람들은 저마다 바삐 걸어가지만,

두터운 옷에
감추어버린 그들의 
마음. 마음들은
무엇을 찾아가는가

2천년전 밝게 비추던
그 사랑의 빛은
지금도 우릴 내려다 보지만,

도시의
이 회색빛 그늘의 
사람들은 
모두 저마다
마음을 감추고 있다.

화려한 네온사인은 
그저 가식뿐.

조용한 사랑과 
자그마한 눈물은 그렇게 
묻혀져 간다.


</pre>
