 어부의 노래

별빛이 반짝이는 저 바다위에 노래가 있다.
떠나보내야만 하는 슬픈이의 노래가 있다.
그는 가난하지만, 그에겐 노래가 있다.
사람들이 모르는 그 노래를 부르면
길잡이 등대는 그의 낡고 외로운 조명
파도는 그에게 노래를 가르친다.
그는 오늘도 삐걱거리는 뱃전에 앉아
그의 낡은 노래를 바다에 던진다.

 1996.6.24
