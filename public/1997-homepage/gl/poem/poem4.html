	내가 홀로 남았을때
				94.8.29
내가 홀로 남았을 때
적막감은
내게 슬며시 
찾와와요.

그는 무서운 얘기도 해주고
굳센 얘기도 해주고
우정 얘기도 해주지요.

그리고 
그녀는 아름다운 얘기도 해주고
슬픈얘기도 해주고
사랑얘기도 해주지요.

적막감과 얘기할때
비로서 난 혼자임을 느끼지요.
적막감은 나의 오래고
유일한 벗이에요.

언제나 내 곁에 있어서
나를 지켜보다가
내가 홀로 남았을때
나에게 속삭이지요.

오늘도 그와 그녀는 
나에게 속삭이려고 
맴을 돌고 있어요.
 

</pre>
