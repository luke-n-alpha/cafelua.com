세상을 적시는 당신의 사랑이
내 두뺨에 와 닿아 나를 놀립니다.
세상은 생명과 싱그러움으로 이루어진
당신의 사랑을 노래합니다.
당신의 사랑을 목말라 하던 이 푸른세상은
당신을 우러르며 환희의 춤을 추며 손을 듭니다.
이 비가 그치면
믿음과 순종의 노인에게 약속하셨던
푸른하늘을 가로지르는
당신의 사랑을 꿈꾸겠지요.
