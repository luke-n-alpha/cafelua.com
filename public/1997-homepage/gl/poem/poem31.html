	한양고향
			96.1.17
고향의 봄을 불러보오
마음의 고향을 찾아보오
없어도 좋으니 불러나 보오, 찾아나보오.

한양골 태어나
자동차밖에 모르오
한양골 자라서
빌딩밖에 모르오
한양골 살아서
철교밖에 모르오

그러나
달구지도 끌어보고
초가집에 뉘어보고
징검다리 건너는건

어멘데서 
고향찾는
한양사람이라 그러오

없어도 좋으니
망향의 봄은 부르지 마소
그래도 내는
고향을 그려야 하오
되뇌보오, 물어보오.

</pre>
