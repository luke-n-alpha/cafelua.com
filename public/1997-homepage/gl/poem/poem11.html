	눈 	물	
				94.9.14

눈물은 귀한거랍니다.
눈물은
약한것도 거짓도
부끄러운 것도 아니랍니다.

눈물을 흘릴대
자신을 비로서 볼 수 있어요.
한방울의 눈물눈물마다
우리 자신의 
더러운 모습,오만들은
씻겨 내려갑니다.

눈물은 진정으로 
모든 감정들을
꾸밈없이 거짓엇ㅂ이
남에게 들어내고
자신을 용서하는
유일한 아름다움이랍니다.

눈물을 흘릴때,
비로서 그 사람은
깨끗해 집니다.

눈물은 정말로 귀한거랍ㄴ디ㅏ.
진실한 아름다움 이랍니다.
