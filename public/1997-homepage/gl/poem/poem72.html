      <pre>

가슴에 묻었던 말
어렵게 어렵게 너에게 건내고
난 너의 눈치를 살펴.

하지만 너무나도 쉽게
피이하고 웃어버리는 너

이건 농담이 아니야.
진심이라구.
내속이 얼마나 더 새카맣게
타야겠니 ?

아니, 오히려 잘된건지도 몰라.

심각해진 네가 나를 피하려 한다면
그것만큼 심각한게 없지.

또 가슴 쓸어내리며,
너에 대한 말은
다시 묻어버린다.

반쯤 타버린 내가슴에
발로 다지고, 이왕묻는거 꾹꾹 묻어야지
너에게 들킬라.

하지만, 다 묻고 나면
왠지 모르는 아쉬움.
 96. 11. 3
