	마음을 다스리는 마음들
				94. 8. 26

내곁에 항상 계신
나의 아버지여 
저는 바라옵니다.

화가 날때는
용서하는 마음을
사랑하는 마음을
힘이 들 때
용기하는 마음을
인내하는 마음을
의심할때
믿음하는 마음을
신앙하는 마음을

기뻐할때 슬퍼하는 
남을 생각하는 마음을
행복할때 불행하는
남을 생각하는 마음을
성공할때 실패하는
남을 생각하는 마음을

마음을 다스리는 마음들을
살아가며 의지할 수 있는
마음들을
정말로 원하옵고
바라옵니다.

사랑하는 아버지여~ 
나를 그런 따뜻한 
마음들로 채워주소서..
