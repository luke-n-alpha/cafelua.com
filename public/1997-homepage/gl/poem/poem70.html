 모순
 96.11.1

나를 항상 골리기만 하는 너
날 볼때면 눈 흘낏, 혀 빼쭉.
세상에 저런 원수가 있을까.

그런네가 침을할땐
기분좋아 웃어야 할 나는
웃을 수 없어
차라리 울고 말지.

그런 네가 밝을때는
배아파 울어야 할 나는
울수도 없어.
차라리 웃고 말지.

도대체 어떻게 된거지 ?
원수인 너인데,
너 때문에 내 감정은 미쳐가나봐.
웃을때, 울때도 구별 못하는
나는 정말 바보인지.

</pre>
