	하     늘
			94.9.1

학교의 조그마한 하늘을 봅니다.
건물 사이의 조그마한 하늘엔
파아란 자유와 
하이얀 꿈이 있습니다.

자그마한 교실 창밖의 하늘
하늘은 거기에 있습니다.

교실에는 아이들이 떠듭니다.
그들은 꿈과 자유를 
이야기하고 있을까요 ?
저 푸른 하늘의 꿈을요.

그들의 하늘은 어디에 있을까요 ?
저도 모르겠습니다.

비둘기 한마리가 자그마한
하늘을 가로지릅니다.
