	누군가의 길위에
			94.10.7

누군가의 길위에
내 자신이 놓여있을때,
느끼는 한량없는 쓰라림이
내 가슴을 후비고

허전한 길 위에
허전한 도화지의
공허함이 내 가슴에 가득하고

너를 위해 말할수 없는 것들은
내 가슴을 떠오는데

너의 아픔은 내 가슴에 젖어와
나를 아프게 하건만

너의 아픔을 씻을 수 없는
내가 부끄러워지는 까닭은
나의 아픔은 너무도 크고
힘겨운 너의 숙제기 때문에
