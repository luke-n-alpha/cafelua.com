어지러운 기침 속에 떠오르는
당신 모습
그 모습은 두근대는 나의 가슴속에
그리움으로 다시 다가옵니다.

당당한 모습으로 당신께 자랑하려고도 했건만,
약해진 나의 모습으로 당신께 의지하고픈 마음.

나 혼자라고,
나혼자면 충분하다고
외쳤던 나의 모습
이제는 한숨속에 지나갑니다.

아픈 몸 이끌고, 하늘 한번 쳐다보지만,
당신은 이곳에서 그곳에서
나를 보며 웃고만 계시네요.

보이지 않는 내 마음속 당신이여
그대의 손길과 입술, 그대의 눈물 느끼고 싶네요.
