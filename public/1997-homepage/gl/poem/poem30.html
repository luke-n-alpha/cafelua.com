	반딧불과 나

시간의 틈새에서
나는 가슴을 조이고 있다.
갈팡질팡
시간은 흘러갈 뿐
가는 곳은 어디인지

한숨을 내쉬며, 쓴웃음 짓지만
그대로 남는건 나의 쓸쓸하고
허전한 나의 마음뿐

어디로든 가야 할텐데
저멀리 깜빡이는
허구일지 모르는
반딧불 하나와 
황량한 벌판에
나 하나.

</pre>
