      <pre>
 
마음이 울적해질때
삶이 무엇인지
끝없는 질주끝에
더해지는것은 슬픔뿐인가요

나의 꿈을 간절한 나의 꿈을
날려보고 싶은데
질척한 비는 내 마음을
적셔버렸나요.

산위에 메아리치는
내 노래를 부르고 싶은데
세상의 신음속에 
묻혀버렸나요

누구나 나를 감싸주었으면 하나
헛된 망상뿐,

그런데도 재수없는 시계는 계속 도네요.
젊음을 갉아먹으면서

증오하길 바래요. 이런 내 마음을.
사랑하길 바래요. 나의 삶을.
이럴때 모든것이 멈추고
실컷 울었으면.
잊혀져가는 나의 삶을 위해.

				96. 2. 15
