당신 원망도 했어요.
초라한 저라고도 생각했어요.

세상 사람들이 저를 멀리하고
제모습 온전치 않음을 알때
눈물도 많이 흘렸습니다.

모두 절 버린줄 알았는데
모두 절 필요없는 존재로 여기는 줄 알았는데

푸른 하늘과 따스한 햇살.
그리고 사랑하는이, 사랑할이 주시는
당신은 절 버리시지 않으셨더군요.

험한 세상이라지만,
당신의 따스한 품안에서는
이 작은 심장 멈출때까지
내가 무엇을 할수 있던간에
눈물을 감추고
항상 웃으며 살렵니다.
