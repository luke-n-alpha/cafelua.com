	친구라는 이름
			95.10.29

친구야-
너의 이름을 불러보렴.
너는 못 느끼겠지만,
그 안에 많은 것들이
숨어 있단다.

꿈이라는 이름과
희망이라는 이름
사랑이라는 이름

또한 우정이라는
흐뭇한 이름도 있지.

많은 것들 품은
너의 이름을 
나에게도 부를 기회
주지 않겠니 ?

나의 친구야-
