<svg width="600" height="900" viewBox="20 20 30 60" xmlns="http://www.w3.org/2000/svg" style="background-color: #f4e4bc; font-family: serif;">
  <!-- Background Texture -->
  <rect x="20" y="20" width="30" height="60" fill="#f4e4bc" />
  <filter id="parchment">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
    <feDiffuseLighting in="noise" lighting-color="#f4e4bc" surfaceScale="2">
      <feDistantLight azimuth="45" elevation="60"/>
    </feDiffuseLighting>
  </filter>
  <rect x="20" y="20" width="30" height="60" fill="#f4e4bc" filter="url(#parchment)" opacity="0.5"/>

  <!-- Lat/Lon Grid (Reference) -->
  <g stroke="#a0aec0" stroke-width="0.1" stroke-dasharray="1,1" opacity="0.3">
    <line x1="20" y1="30" x2="50" y2="30" /> <!-- 70N -->
    <line x1="20" y1="40" x2="50" y2="40" /> <!-- 60N -->
    <line x1="20" y1="50" x2="50" y2="50" /> <!-- 50N -->
    <line x1="20" y1="60" x2="50" y2="60" /> <!-- 40N -->
    <line x1="20" y1="70" x2="50" y2="70" /> <!-- 30N -->
    <line x1="30" y1="20" x2="30" y2="80" /> <!-- 30E -->
    <line x1="40" y1="20" x2="40" y2="80" /> <!-- 40E -->
  </g>

  <!-- REGIONAL BOUNDARIES (Proposed Logical Geography) -->
  
  <!-- 1. The Frost Range (North/Central Divider) ~55N -->
  <path d="M 22 45 L 25 43 L 28 45 L 31 43 L 34 45 L 37 43 L 40 45" stroke="#4a5568" stroke-width="0.5" fill="none"/>
  <text x="31" y="47" font-size="1.5" fill="#4a5568" text-anchor="middle" font-weight="bold" font-style="italic">Frost Range</text>
  
  <!-- 2. Mist River (Central/South Divider) ~38N -->
  <path d="M 40 62 Q 30 63 20 60" stroke="#4a90e2" stroke-width="0.5" fill="none" stroke-dasharray="2,1"/>
  <text x="30" y="61" font-size="1.5" fill="#2c5282" text-anchor="middle" font-style="italic" opacity="0.7">Mist River</text>

  <!-- REGION LABELS -->
  <text x="35" y="28" font-size="3" fill="#2c5282" text-anchor="middle" font-weight="bold" opacity="0.3">CALEDONIA</text>
  <text x="35" y="52" font-size="3" fill="#2c5282" text-anchor="middle" font-weight="bold" opacity="0.3">LAURASIA</text>
  <text x="35" y="75" font-size="3" fill="#2c5282" text-anchor="middle" font-weight="bold" opacity="0.3">LARAMID</text>

  <!-- GEOGRAPHY -->
  
  <!-- Dibon River (NE -> SW) -->
  <path d="M 40 50 Q 38 60 35 67 T 25 70" stroke="#4a90e2" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <text x="32" y="65" font-size="1.5" fill="#2c5282" font-style="italic" transform="rotate(45, 32, 65)">Dibon River</text>

  <!-- Achor Mountains (NE) -->
  <text x="45" y="35" font-size="2" fill="#2f855a" text-anchor="middle" font-weight="bold" opacity="0.8">ACHOR MTS</text>
  
  <!-- Southern Mountains (South of Laodicea) -->
  <path d="M 25 72 L 30 69 L 35 72 L 40 69 L 45 72" stroke="#4a5568" stroke-width="0.3" fill="none"/>

  <!-- TRAVEL PATH: Aron's Journey -->
  <!-- Slomit(28,65) -> Nahaliel(40,50) -> Achor(45,35) -->
  <path d="M 28 65 L 40 50 L 45 35" stroke="#e53e3e" stroke-width="0.5" stroke-dasharray="1,1" fill="none"/>
  <text x="34" y="58" font-size="1.2" fill="#c53030" text-anchor="middle" font-weight="bold" transform="rotate(-40, 34, 58)">Aron's Journey</text>

  <!-- LOCATIONS -->
  
  <!-- NORTH -->
  <g fill="#e53e3e" stroke="black" stroke-width="0.1">
    <path d="M 35 21 L 36 23 L 34 23 Z" fill="#4a5568"/> <!-- Dragon Temple -->
    <text x="35" y="20.5" font-size="1.2" fill="#4a5568" text-anchor="middle" stroke="none">Dragon Temple</text>

    <circle cx="35" cy="25" r="0.5" fill="#2f855a"/> <!-- Caledonia -->
    <text x="35" y="26.5" font-size="1.2" fill="#2f855a" text-anchor="middle" stroke="none">Caledonia</text>

    <rect x="29" y="39" width="2" height="2" /> <!-- Phrygia -->
    <text x="30" y="38" font-size="1.5" fill="#742a2a" text-anchor="middle" font-weight="bold" stroke="none">Phrygia</text>
    
    <circle cx="32" cy="42" r="0.6" fill="#d69e2e"/> <!-- En-Rogel -->
    <text x="32" y="43.5" font-size="1" fill="#744210" text-anchor="middle" stroke="none">En-Rogel</text>
    
    <circle cx="45" cy="37" r="0.6" fill="#d69e2e"/> <!-- Urfa -->
    <text x="45" y="38.5" font-size="1" fill="#744210" text-anchor="middle" stroke="none">Urfa</text>
  </g>

  <!-- CENTRAL -->
  <g fill="#e53e3e" stroke="black" stroke-width="0.1">
    <circle cx="40" cy="50" r="0.6" fill="#d69e2e"/> <!-- Nahaliel -->
    <text x="40" y="49" font-size="1" fill="#744210" text-anchor="middle" stroke="none">Nahaliel</text>

    <circle cx="25" cy="52" r="0.8" /> <!-- Imra -->
    <text x="25" y="50.5" font-size="1.5" fill="#742a2a" text-anchor="middle" font-weight="bold" stroke="none">Imra</text>

    <circle cx="35" cy="55" r="0.6" fill="#d69e2e"/> <!-- Taberah -->
    <text x="35" y="56.5" font-size="1" fill="#744210" text-anchor="middle" stroke="none">Taberah</text>

    <circle cx="20" cy="58" r="0.8" /> <!-- Smyrna -->
    <text x="23" y="58" font-size="1.5" fill="#742a2a" text-anchor="start" font-weight="bold" stroke="none">Smyrna</text>
  </g>

  <!-- SOUTH -->
  <g fill="#e53e3e" stroke="black" stroke-width="0.1">
    <circle cx="28" cy="65" r="0.6" fill="#d69e2e"/> <!-- Slomit -->
    <text x="28" y="64" font-size="1" fill="#744210" text-anchor="middle" stroke="none">Slomit</text>

    <rect x="34" y="66" width="2" height="2" /> <!-- Laodicea -->
    <text x="35" y="65" font-size="1.5" fill="#742a2a" text-anchor="middle" font-weight="bold" stroke="none">Laodicea</text>

    <rect x="39" y="67" width="2" height="2" /> <!-- Antipatris -->
    <text x="40" y="66" font-size="1.5" fill="#742a2a" text-anchor="middle" font-weight="bold" stroke="none">Antipatris</text>

    <circle cx="22" cy="68" r="0.8" /> <!-- Rasea -->
    <text x="22" y="66.5" font-size="1.5" fill="#742a2a" text-anchor="middle" font-weight="bold" stroke="none">Rasea</text>

    <circle cx="25" cy="70" r="0.8" /> <!-- Nicopolis -->
    <text x="25" y="72" font-size="1.5" fill="#742a2a" text-anchor="middle" font-weight="bold" stroke="none">Nicopolis</text>

    <circle cx="40" cy="75" r="0.6" fill="#d69e2e"/> <!-- Tophel -->
    <text x="40" y="77" font-size="1" fill="#744210" text-anchor="middle" stroke="none">Tophel</text>
  </g>

</svg>
