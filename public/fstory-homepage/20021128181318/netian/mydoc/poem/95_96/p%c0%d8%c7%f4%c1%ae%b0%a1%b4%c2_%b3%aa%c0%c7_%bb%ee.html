	잊혀져 가는 나의 삶

			96.2.15

누군가 나를 감싸 주었으면 하나,
헛된 망상뿐.

그런데도 재수없는 시계는 계속 도네요.
젊음을 갉아 먹으면서

증오하길 바래요. 이런 내 마음을.
사랑하길 바래요. 나의 삶을.

이럴때 모든것이 멈추고
실컷 울었으면,
잊혀져가는 나의 삶을 위해.
