	나무 
		아무개(정철우 옮김-김광석 3집중)

한결같은 빗속에 서서
젖는 나무를 보며
한없는 햇빛과 개인하늘을
나는 잊었소

누구하나 나를 찾지도
기다리지도 않소

끊임없는 망각속에
나는 흔들리지 않아도 좋소.

시작도 끝도 없는 나의 침묵을
아무도 건드리지 못하오

무서운것이 내게는 없소
누구에게 감사받을 생각없이

나는 나에게 황홀을
느낄뿐이오.

나는 하늘을 찌를때까지
자랄려 하오.

무성한 가지와 그늘을 펼려하오.
