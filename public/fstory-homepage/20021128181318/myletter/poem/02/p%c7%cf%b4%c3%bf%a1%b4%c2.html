하늘에는 별들의 길이 있습니다.
사람들이 살면서 가끔은 길을 잃듯이
길을 잃어버리는 별들도 있답니다.

차가운 바다에 떨어진 별들은
자신의 빛으로 몸을 덥히다가 이내
차가운 바닷속으로 가라앉아버립니다.

별을 줏는 한 소녀가 있었습니다.
폭풍우가 불어 별들이 쉬이 길을 잃는 날이면,
등불을 들고 나와 별들의 길을 밝혀주었습니다.
그리고, 가끔씩은 별을 주어서
직접 하늘로 되돌려 보내주었습니다.

                       2002. 06. 08
