항상 껍데기에 쌓여있었다. 
어린아이처럼 약한것을 감추기 위해... 

그냥 아이처럼 울어봤으면 좋겠다. 
그러나, 나이가 먹어 우는 법을 잊어버렸다. 
그래서 더 슬프다. 

배가고파도 배고프다고 말하지 못하고 
좋아해도 좋아한다고 말하지 못하고 
아파도 아프다고 말하지 못하고 

아이에서 어른이 되어간다. 

그것이 멋있다고도 생각했다. 
그리고, 그것이 남을 위하고 
상대를 지키는길이라고 생각했다. 

그리고 지금은 
내가 상처받는 길이란걸 깨달았다. 

                         2002. 05. 15
