나의 무뎌진 정신을 수습해 보려 합니다.

그런 나를 측은하게 바라보는
당신만 같습니다.

당신의 숨결은
이겨울 찬바람, 내가슴속 허전함.

당신도 어디선가 나를 그릴겁니다.

당신을 찾을겁니다.
그리고, 얼음속에 갇힌 
그대 볼에 키스하며
