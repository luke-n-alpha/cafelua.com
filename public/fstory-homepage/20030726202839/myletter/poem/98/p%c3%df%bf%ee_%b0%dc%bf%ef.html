	추운 겨울
			97.12.9
유난히 추운 이번 겨울
괜시리 뛰어도 봤다.
안춥다고 소리 질러봤다.
눈부신걸 참고, 태양도 쳐다봤다.

그때 어디선가 들려오는 다정한 목소리
" 자기 춥지.. "
우습고 부질없는 내행동 앞으로
어깨를 감싸안은 두 사람이 지나갔다.

한껏 벌렸던 두팔 내리고,
한숨 푹... 어깨 축..
나의 모든 행동이 수포로 돌아가는 순간.

거기다 나의 버스도 안스고 지나간다.
화가나도 슬퍼도 비참해도 
어디 호소할때 하나 없다.
