대게는 잊혀진 기억들
그러나 한번 곁에오면 참을수 없이
무거워져버리는 기억들.
긴 소설의 마침표와도 같고,
절망의 구렁텅이에서 나를 유혹하는 손짓.

역사속에 이것을 뛰어넘는
사랑도 있다지만은
역시 사랑도 그 앞에서는
마음껏 웃지 못한다.

그 아픔이 너무 크기때문일까
우정이란 이름으로 위로하기 힘들고
그것은 마치 땅속 7년간의
매미 허물벗기 처럼 외롭고 고통만
있는것처럼 느껴지는것.

하지만 계중에도 사랑이 좋은것은
완전히 잊혀지지 않는 추억남김과
조금이라도 편해지고자 하는
위로함 때문일거다.
