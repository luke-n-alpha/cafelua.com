	 비 오는 날
			96.6.17
비가오는 어두운 밤거리
난 어깨를 짓누르는 무거운 책가방에
우산도 없이 집을 향해 걷는다.

자그마한 우산속에 속삭이는 연인들은
내마음 설레게 하곤 했지만,
나는 물에 젖은 회수권 한장을 
손에쥐고 버스에 몸을 실어버렸다.

빗속에 덜컹대는 버스는
오늘도 힘겨워만 보인다.

때로는 이 비가 시원하게 
모든것을 쓸어버릴듯
내 마음을 씻곤 했지만

버스창에 어리는 이 비가
오늘은 나에게
알 수 없는 슬픔으로 다가온다.
