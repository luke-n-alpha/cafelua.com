<pre> 
밤.
저주 받은 이들의 시간이 왔다.
빛의 자식들아.
너희들이 우리들의 눈물을 아느냐.
저 어두운 곳에 숨어서
우리는 우리의 삶을 노래한다.
가진자들이여 마음껏 비웃어라.
언젠가 우리들은
달의 뒷면에서부터 일어서리라.
그때는 너희들도
저 달의 울부짖음을 들으리라.

너희들의 축복은
누군가의 피로부터
시작된 것임을 잊지마라.

기억하라.
우리들은 언제나 그대들이
외면하는 그 곳에 있다.
 
                   2001. 11. 06
