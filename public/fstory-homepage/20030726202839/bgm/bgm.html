//0 -> 일반(순차) 재생모드 (기본값)
//1 -> 랜덤 재생모드
//즉, 처음에 이 페이지를 로딩할때에 랜덤으로 음악이 선택되고
//다음, 이전트랙 버튼을 눌러도 임의의 곡으로 이동합니다
var playMode = 1;

//곡과 곡사이의 쉬는 시간
//윈도우 미디어 콘트롤로 음악을 스트리밍 재생하기 때문에 설정해야 합니다
//빠른 계정이나 고속통신 사용자는 4,5초 정도가,
//외국 계정이나 모뎀 사용자는 7초 정도가 적당합니다
var restLength = 6;


//BGM 제목의 표시여부
//현재 연주되고 있는 bgm의 제목을 <input> 박스에 표시하려면 1을
//상태 표시줄에 표시하려면 2를
//표시하지 않으려면 0을 선택하십시오.
var showTitle = 1;

//BGM Player 초기 로딩시 재생여부
//BGM Player가 처음 로딩되었을 때 부터 음악이 재생되기를 원하시면 1,
//그렇지 않으면 0을 넣으십시오.
var doFirstPlay = 1;

//연주할 곡 목록(즉, 플레이 리스트)를 작성합니다
//addbgm('음악 파일의 전체(물리)경로', '음악 제목', 음악 연주시간(초)); 로 써주시면 됩니다
//(예) addbgm('http://www.server.com/folder/file.wma','Music',125);
//만약에 음악 제목을 써주시지 않으면 자동으로 'Track 번호' 식으로 됩니다
addbgm('bgm01.wma','Yesterday-체리필터',232);
addbgm('bgm02.wma','너무늦은건가요-소향&포스',283);

addbgm('bgm04.wma','너에게만-미소의세상OP(투니버스)',192);
addbgm('bgm05.wma','주없이 살수없네-컨티넨탈싱어즈',282);
addbgm('bgm06.wma','#1-자우림',273);
addbgm('bgm07.wma','마법에성-체리필터',300);
addbgm('bgm08.wma','Just Communication-건담Wing',81);
addbgm('bgm09.wma','Cant live a day-avalon',289);
