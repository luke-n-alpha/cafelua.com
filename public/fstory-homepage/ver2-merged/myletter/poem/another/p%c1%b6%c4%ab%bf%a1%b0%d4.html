언젠가부턴가
내 마음한구석에 
자리잡은 조카의 꽃한송이.
바람불면 떨어질까
달래었는데
그러기에 세차고 모진바람에
잘도 견디어 벼텨선
나의 조카
내 가슴에 영원한 꽃이되어
지지 말아다오.
언제나 눈감으면 떠오르는 
나의 조카가 되어다오
가족의 기대에 부응하는 
조카가 되어다오.
우리의 가슴에 영원히 
안식하는
조카가 되어다오
믿음소망사랑이 넠치고
무조건 사랑받는 사회인 되어
모든 사람의 가슴에 기억되는 
조카가 되길 영원히 바랄뿐이다 !
