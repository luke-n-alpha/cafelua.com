		정철우

만약 당신에게 1주일의 시간만이 주어진다면
당신은 무얼하실텐가요.

최선을 다하면 살고
그렇지 못하면 죽으리라

하면, 당신은 어떻게 하실텐가요.

어떤이는 자고 어떤이는 공부하고
어떤이는 일주일간 죽도록 찍기연습
토비콤과 설탕을 주식으로 먹는 사람

당신은 이들중 어떤 사람일텐가요.

희뿌연 형광등불 아래 행복하게 공부하는
이 모습들을 가슴속에 새기기라도 하듯
교실한번 둘러봤다.

삶의 길을 택하자.
