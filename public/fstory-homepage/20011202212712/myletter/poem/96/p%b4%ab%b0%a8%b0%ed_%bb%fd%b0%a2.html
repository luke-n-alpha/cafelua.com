가만히 눈감고 생각해봐요.
지금 당신이 누굴 생각하는지.
누구의 얼굴이 떠오르나요.
그의 웃고 있는 모습이 떠오른다면
당신은 정말 행복한 사람입니다.

그가 누구던지
당신을 당신이
사랑할수 있는 사람일테니까요.

세상의 외로움 괴로움
하여튼 지겨운것들 이사람에게
위로받는 다면 더할나위 없겠지요.

하지만 무엇보다도 큰 것은
당신이 그를 사랑한다는 그 사실입니다.

				1996. 7. 9
