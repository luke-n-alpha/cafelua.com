빛나는 기쁨과 찬란한 새벽에
마음을 담뿍 젖고 살아가요.
죄와 시기와 슬픔들의
나쁜 이름들은 모두 버리고
삶과 사랑과 감사들의
좋은 이름들만 기억해요.

우리의 하얀 나래깃 끝마다
우리의 마음들을 달고
빛나는 태양을 향해
날개짓 해요.

때론 먹구름과 세찬 바람이 괴롭히고
혼자란 생각에 외로워도
파아란 하늘을 보고, 푸른 대지를 보고
꿈을 꾸며 날아봐요.

그 꿈을 이루며,
우리의 날개를 의심하지 말고
사랑과 웃음을 가득안고
세상의 하늘을 날아봐요.

			96.1.29
