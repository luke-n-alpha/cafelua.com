오늘두 
혼자서 칼바람 뚫고 
길잃은 강아지마냥 
얻는것도 없이 이리저리 돌아다니다가
저녁한끼 때우고자 동네 분식점에 
또 찾아들었다.

그리 크지 않은 손님도 없는가게에 
높게 메달린 TV에서 흘러나오는 뉴스에
이래저래 혼잣말도 해보고,
감탄과 욕설도 해보았지만
결국은 모두 남 얘기.

결국 아줌마가 가져나온 밥을 
맛도모르고 입속에 우겨넣었다.

이제는 익숙해질만도 한데..
그래도 찬겨울 허전한건 어쩔수 없구나.
그냥 또 그렇듯이 또 마음한구석 쓰리다.

                         2002. 01. 08
