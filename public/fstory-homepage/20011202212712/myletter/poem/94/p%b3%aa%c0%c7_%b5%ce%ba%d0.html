	나의 두분
			94.10.15

내가 처음 햇님과
인사할때 곁에 계신 두분.
어린시절 가장 아름답고
가장 굳건한 모습이었던 두분

하지만 내가 세상을 알게 되면서
점점 작게만 보이는 두분

무엇이 두분을 그렇게 
초라하게 작게 만든것일까 ?

세월이란 악마 때문인가 ?
세월이란 악마는 또한
나를 이렇게 크게 해놓았다.
세월은 두분의 젊음을 빼앗아
내게 건내 주었다.

두분의 인생길에
내가 놓인 이유는 무엇인지 
그러기에 나의 죄책감은 커진다.

그러나 두분은 
나를 너무나 사랑함으로
이작은 내가 슬퍼진다.
