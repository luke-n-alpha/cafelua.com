 세상에 던지는 돌 하나
				95.12.14

나는 세상에
작은 돌하나를
던져본다.

하지만,
상처받는 것은
나이고 우리뿐이다.

세상은 싸늘한 시선과
굳게 다문 입술루과
가시돋힌 힘 뿐이다.

잘못된줄 알면서
그릇된줄 알면서
세상에 보내는 웃음들

그 웃음은 거짓인것을
나는 분노로 본다.

그러나, 지쳐서
아파서 슬퍼서
주저앉아서
어린아이처럼 
울어버린다.

그래도 
나는 돌 하나를 
집어든다.
그것이 나의 상처가 될지라도
언젠가 동심원을 그리는
커다란 물결이 되리라는 
믿음이 있기에~
