내 어린 시절
단풍닢 따다 네 머리에 꽃아주고
어머니께서 내게 고이 쥐어준
곶감하나 멋적게 건내주었던 나.
이제는 낡은 일기장, 마른 단풍닢은
추억을 말하려는 듯,
우리 놀던 낡은 우물엔
잔잔한 너의 웃음만이 남고
단풍닢 하나만 떠간다.
