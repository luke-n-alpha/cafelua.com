	휴식의 풍경
			98.5.17
몸하나, 베낭하나
그저 정신없이 걷기
어느 먼 여행.
무엇하려 왔는지
어느곳까지 왔는지
천천히 잊어갔을 무렵.

낯선 까페 앞, 작은 벤치
문득 깨달은 낯설음.
익숙함과 다른 느낌.

하지만,
다시 본 풍경엔
늘맘같은 파란하늘.
겨우 느껴본 봄바람.

그리고, 단골이 있을법한 까페.
웃음이 예쁠것 같은
소녀 하나.
