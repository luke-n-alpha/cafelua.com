	너의 상상

난 너를 본적도 없어.
단지 너를 느껴 봤을뿐
네 손 한번 잡아보지 못한 나는
그저 널 상상할뿐이야.
아름답고, 상냥하고, 착하구
갖은 좋은 수사들을 붙여보지만
너에게 견줄수나 있을까 모르겠다.
지금은 모르지만 말이야.
그 언젠가 만날 너 말이야.
